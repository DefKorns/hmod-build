name: hmod

on:
  workflow_call:
    inputs:
      release-name:
        description: Release title prefix (the tag is appended)
        type: string
        required: true
      make:
        description: One make invocation per line (arguments only)
        type: string
        default: hmod
      docker:
        description: Run make inside the classicmini-cross-toolchain image (needs vendor/hmod-build)
        type: boolean
        default: false
    secrets:
      HUB_DISPATCH_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Toolchain image
        if: inputs.docker
        run: echo "TOOLCHAIN_IMAGE=$(sh vendor/hmod-build/toolchain-image.sh)" >> "$GITHUB_ENV"

      - name: Build hmods
        env:
          MAKE_LINES: ${{ inputs.make }}
          IN_DOCKER: ${{ inputs.docker }}
        run: |
          printf '%s\n' "$MAKE_LINES" | while IFS= read -r args; do
            [ -n "$args" ] || continue
            if [ "$IN_DOCKER" = true ]; then
              docker run --rm -v "$PWD:/src" -w /src "$TOOLCHAIN_IMAGE" \
                sh -c "git config --global --add safe.directory '*' 2>/dev/null; make CROSS_PREFIX=arm-linux-gnueabihf- $args"
            else
              make $args
            fi
          done
          ls -l out/*.hmod

      - uses: actions/upload-artifact@v7
        with:
          name: hmods
          path: out/*.hmod

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hmods
          path: out

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: src

      - name: Release notes
        id: notes
        working-directory: src
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          file="release-notes/$TAG.md"
          if [ ! -f "$file" ]; then
            echo "No $file - using generated notes"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          {
            cat "$file"
            if [ -n "$previous" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$previous" "$TAG"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        id: release
        continue-on-error: true
        with:
          name: ${{ inputs.release-name }} ${{ github.ref_name }}
          files: out/*.hmod
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      # the GitHub API sometimes drops the connection ("other side closed"); the build is done, so try once more
      - name: Wait before retrying the release
        if: steps.release.outcome == 'failure'
        run: sleep 30

      - uses: softprops/action-gh-release@v3
        if: steps.release.outcome == 'failure'
        with:
          name: ${{ inputs.release-name }} ${{ github.ref_name }}
          files: out/*.hmod
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Rebuild the hakchi-repo hub
        env:
          GH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HUB_DISPATCH_TOKEN not set - the hub picks this release up on its daily build"
            exit 0
          fi
          gh api repos/DefKorns/hakchi-repo/dispatches -f event_type=hmod-released
